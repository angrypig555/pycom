[project]
name = "pycom"
version = "0.1.0"
description = "A remote shell protocol using sockets"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=46.0.6",
]

[project.scripts]
pycom = "pycom.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pycom"]
